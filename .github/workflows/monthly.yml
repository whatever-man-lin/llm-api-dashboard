name: Monthly LLM API Policy Update (zero token)

on:
  schedule:
    - cron: "0 1 1 * *"   # 每月 1 号 UTC 01:00 ≈ 北京时间 09:00
  workflow_dispatch:      # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 零 token：脚本仅用标准库 urllib 抓取公开数据源，无需任何 API key / LLM
      - name: Generate data.json (zero token)
        run: python generate.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json live_snapshot.json
          git commit -m "chore: monthly zero-token policy update $(date +%F)" || echo "no changes"
          git push
